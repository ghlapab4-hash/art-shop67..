<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ART SHOP อุปกรณ์ | เว็บขายรหัสฟีฟาย &amp; อุปกรณ์เกมมิ่ง ราคาถูก</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050507;
      --card: #0c0c11;
      --border: rgba(39, 39, 42, 0.85);
      --accent: #ef0a17;
      --footer: #c90611;
      --text: #f4f4f5;
      --muted: #a1a1aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: 'Noto Sans Thai', 'Outfit', system-ui, -apple-system, sans-serif; scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    button, input, textarea, select { font-family: inherit; }
    button { cursor: pointer; border: none; background: transparent; color: inherit; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .display { font-family: 'Outfit', 'Noto Sans Thai', sans-serif; }
    .hidden { display: none !important; }

    /* Sticky Navbar matching NavbarAndDrawer */
    .topbar {
      position: sticky; top: 0; z-index: 40;
      border-bottom: 1px solid var(--border);
      background: rgba(7, 7, 10, 0.92);
      backdrop-filter: blur(12px);
    }
    .topbar-inner {
      max-width: 1152px; margin: 0 auto; height: 64px;
      padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    @media (min-width: 640px) { .topbar-inner { padding: 0 24px; gap: 16px; } }
    .brand-group { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    @media (min-width: 768px) { .brand-group { flex: initial; } }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
      border: 1px solid #27272a; background: rgba(24, 24, 27, 0.75);
      display: inline-flex; align-items: center; justify-content: center; color: #e4e4e7;
    }
    .icon-btn:hover { color: #fff; border-color: #3f3f46; }
    .brand-btn { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; text-align: left; }
    .brand-logo { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; border: 1px solid #3f3f46; flex-shrink: 0; }
    .brand-title { font-weight: 800; font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (min-width: 640px) { .brand-logo { width: 36px; height: 36px; } .brand-title { font-size: 18px; } }

    .desktop-nav { display: none; align-items: center; gap: 24px; font-size: 14px; font-weight: 500; color: #d4d4d8; }
    @media (min-width: 768px) { .desktop-nav { display: flex; } }
    .desktop-nav button:hover { color: #fff; }

    .actions-group { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .wallet-pill {
      display: inline-flex; align-items: center; gap: 8px;
      border-radius: 12px; border: 1px solid #27272a; background: rgba(24, 24, 27, 0.9);
      padding: 8px 12px; font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap;
    }
    .auth-pill {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; width: 40px;
      border-radius: 12px; background: var(--accent); padding: 0;
      font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap;
    }
    @media (min-width: 640px) { .auth-pill { width: auto; padding: 0 14px; } }
    .auth-pill:hover { filter: brightness(1.1); }
    .hide-xs { display: none; }
    @media (min-width: 640px) { .hide-xs { display: inline; } }

    /* Side Drawer */
    .drawer-backdrop { position: fixed; inset: 0; z-index: 60; display: flex; }
    .drawer-dim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); }
    .drawer-panel {
      position: relative; z-index: 10; width: 320px; max-width: 88vw; height: 100%;
      background: #08080c; border-right: 1px solid #27272a; overflow-y: auto; display: flex; flex-direction: column;
    }
    .drawer-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid rgba(39, 39, 42, 0.8);
    }
    .drawer-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .drawer-profile { border: 1px solid #27272a; border-radius: 16px; background: rgba(9, 9, 11, 0.9); padding: 14px; }
    .drawer-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
    .drawer-item {
      display: flex; align-items: center; gap: 8px; padding: 10px 10px; border-radius: 12px;
      font-size: 13px; font-weight: 500; color: #d4d4d8; border: 1px solid transparent; text-align: left;
    }
    .drawer-item:hover { background: #18181b; color: #fff; }
    .drawer-item.active { background: rgba(239, 10, 23, 0.14); color: #fff; border-color: rgba(239, 10, 23, 0.4); }

    /* Main Container */
    main { flex: 1; }
    .container { max-width: 1152px; margin: 0 auto; padding: 0 16px; }
    @media (min-width: 640px) { .container { padding: 0 24px; } }

    /* Hero */
    .hero {
      position: relative; margin-top: 20px; overflow: hidden;
      border-radius: 16px; border: 1px solid var(--border); background: var(--card);
    }
    .hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.55; }
    .hero-grad { position: absolute; inset: 0; background: linear-gradient(to top, #050507, rgba(5, 5, 7, 0.7), rgba(0, 0, 0, 0.35)); }
    .hero-in { position: relative; z-index: 2; padding: 48px 24px; }
    @media (min-width: 640px) { .hero-in { padding: 64px 40px; } }
    .hero-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--accent); }
    .hero-title { margin-top: 12px; font-size: 30px; font-weight: 800; line-height: 1.15; color: var(--accent); }
    @media (min-width: 640px) { .hero-title { font-size: 48px; } }
    .hero-sub { margin-top: 8px; font-size: 14px; color: #d4d4d8; max-width: 560px; }
    @media (min-width: 640px) { .hero-sub { font-size: 16px; } }
    .hero-cta { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px; }
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 12px; background: var(--accent); padding: 10px 20px;
      font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap;
    }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-outline {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 12px; border: 1px solid rgba(220, 38, 38, 0.5); background: rgba(0, 0, 0, 0.6);
      padding: 10px 20px; font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap;
    }
    .btn-dark {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 12px; border: 1px solid #27272a; background: #18181b;
      padding: 10px 16px; font-size: 13px; font-weight: 600; color: #e4e4e7; white-space: nowrap;
    }

    /* Ticker & Restock Banner */
    .ticker {
      margin-top: 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--card);
      padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 13px;
    }
    @media (min-width: 640px) { .ticker { flex-direction: row; align-items: center; justify-content: space-between; } }
    .restock-banner {
      margin-top: 8px; border-radius: 12px; border: 1px solid rgba(4, 120, 87, 0.45);
      background: rgba(6, 78, 59, 0.25); padding: 10px 16px;
      display: flex; align-items: center; gap: 10px; font-size: 13px; color: #a7f3d0;
    }

    /* KPI Cards */
    .kpi-grid { margin-top: 20px; display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 640px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
    .kpi-card {
      border-radius: 16px; border: 1px solid var(--border); background: var(--card);
      padding: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .kpi-val { font-size: 30px; font-weight: 800; color: #fff; line-height: 1.1; }
    .kpi-today { margin-top: 4px; font-size: 12px; font-weight: 600; color: #34d399; }

    /* Catalog Header & Filters */
    .cat-header { margin-top: 32px; display: flex; flex-direction: column; gap: 16px; }
    @media (min-width: 640px) { .cat-header { flex-direction: row; align-items: center; justify-content: space-between; } }
    .search-wrap { position: relative; width: 100%; }
    @media (min-width: 640px) { .search-wrap { width: 256px; } }
    .search-input {
      width: 100%; border-radius: 12px; border: 1px solid #27272a; background: var(--card);
      padding: 9px 12px 9px 36px; font-size: 14px; color: #fff; outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .cat-pills { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
    .cat-pill {
      border-radius: 12px; padding: 8px 14px; font-size: 12px; font-weight: 600;
      border: 1px solid #27272a; background: var(--card); color: #d4d4d8; white-space: nowrap;
    }
    .cat-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Product Cards matching StorefrontHome */
    .prod-grid { margin-top: 20px; display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 640px) { .prod-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .prod-grid { grid-template-columns: repeat(3, 1fr); } }
    .prod-card {
      border-radius: 16px; border: 1px solid var(--border); background: var(--card);
      overflow: hidden; display: flex; flex-direction: column; transition: transform .15s, border-color .15s;
    }
    .prod-card:hover { transform: translateY(-2px); border-color: rgba(220, 38, 38, 0.5); }
    .prod-img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: #09090b; }
    .prod-body { padding: 16px; display: flex; flex-direction: column; justify-content: space-between; flex: 1; }
    .prod-title { margin-top: 4px; font-size: 16px; font-weight: 700; color: #fff; }
    .prod-price { margin-top: 16px; font-size: 20px; font-weight: 800; color: var(--accent); }
    .prod-actions { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .prod-buy {
      flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: 12px; background: var(--accent); padding: 10px 12px; font-size: 14px; font-weight: 700; color: #fff;
    }
    .prod-buy:hover { filter: brightness(1.1); }
    .prod-stock { font-size: 12px; font-weight: 600; color: #34d399; white-space: nowrap; }

    /* Subpage Cards & Inputs */
    .sub-wrap { max-width: 960px; margin: 28px auto; padding: 0 16px; }
    .sub-card { border-radius: 16px; border: 1px solid var(--border); background: var(--card); padding: 24px; }
    .field-input {
      width: 100%; margin-top: 6px; border-radius: 12px; border: 1px solid #27272a;
      background: #060609; padding: 10px 14px; font-size: 14px; color: #fff; outline: none;
    }
    .field-input:focus { border-color: var(--accent); }
    .two-col { display: grid; gap: 20px; grid-template-columns: 1fr; }
    @media (min-width: 768px) { .two-col { grid-template-columns: repeat(2, 1fr); } }

    /* Wave Footer matching FooterWave.tsx */
    .footer-root { position: relative; margin-top: 80px; }
    .footer-wave-svg { display: block; width: 100%; height: 56px; }
    @media (min-width: 640px) { .footer-wave-svg { height: 80px; } }
    .footer-body { background: var(--footer); color: #160203; padding: 8px 16px 40px; }
    @media (min-width: 640px) { .footer-body { padding: 8px 24px 40px; } }
    .footer-grid { max-width: 1152px; margin: 0 auto; display: grid; gap: 32px; grid-template-columns: 1fr; }
    @media (min-width: 768px) { .footer-grid { grid-template-columns: repeat(2, 1fr); } }
    .footer-nav { margin-top: 24px; display: grid; gap: 10px; font-size: 14px; font-weight: 600; color: rgba(0, 0, 0, 0.9); }
    .footer-nav button { display: inline-flex; align-items: center; gap: 10px; width: fit-content; }
    .footer-nav button:hover { color: #fff; }
    .footer-contact-box {
      border-radius: 16px; background: rgba(0, 0, 0, 0.16); padding: 20px; color: #000;
      display: flex; flex-direction: column; justify-content: space-between;
    }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,0.82); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-card { width: 100%; max-width: 480px; border-radius: 16px; border: 1px solid #27272a; background: #0d0d13; padding: 24px; }
  </style>
</head>

    function loadCompactState() {
      let saved = null;

      const stockMap = (saved && saved.stockMap) || {};
      const usedSet = new Set((saved && saved.usedCodes) || []);
      return {
        users: (saved && saved.users) || {},
        currentUser: (saved && saved.currentUser) || null,
        products: (STORE_DATA.products || []).map(p => ({
          ...p,
          stockCount: typeof stockMap[p.id] === 'number' ? stockMap[p.id] : p.stockCount
        })),
        settings: { ...(STORE_DATA.settings || {}), ...((saved && saved.textSettings) || {}) },
        kpis: (saved && saved.kpis) || STORE_DATA.kpis,
        activities: (saved && saved.activities) || STORE_DATA.activities || [],
        reviews: (saved && saved.reviews) || STORE_DATA.reviews || [],
        redeemCodes: (STORE_DATA.redeemCodes || []).map(c => ({ ...c, used: c.used || usedSet.has(c.code) })),
        orders: (saved && saved.orders) || [],
        topups: (saved && saved.topups) || []
      };
    }

    function save() {
      try {
        const stockMap = {};
        state.products.forEach(p => { stockMap[p.id] = p.stockCount; });
        const usedCodes = state.redeemCodes.filter(c => c.used).map(c => c.code);
        localStorage.setItem(STATE_KEY, JSON.stringify({
          users: state.users,
          currentUser: state.currentUser,
          stockMap,
          usedCodes,
          kpis: state.kpis,
          orders: state.orders.slice(0, 100),
          topups: state.topups.slice(0, 100),
          activities: state.activities.slice(0, 40),
          reviews: state.reviews.slice(0, 40)
        }));
      } catch {}
      renderAll();
    }
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function doAuth(mode) {
      const u = (document.getElementById('inpUser')?.value || '').trim();
      const p = document.getElementById('inpPass')?.value || '';
      if (!u || p.length < 4) { msgBanner = 'กรุณากรอกชื่อผู้ใช้และรหัสผ่านอย่างน้อย 4 ตัวอักษร'; renderMain(); return; }
      if (mode === 'register') {
        if (state.users[u]) { msgBanner = 'ชื่อผู้ใช้นี้มีผู้ใช้งานแล้ว'; renderMain(); return; }
        state.users[u] = { pass: p, balance: 0, points: 0 };
        state.currentUser = u;
        state.kpis.totalUsers = (state.kpis.totalUsers || 0) + 1;
        state.kpis.usersToday = (state.kpis.usersToday || 0) + 1;
        save(); goRoute('home');
      } else {
        if (!state.users[u] || state.users[u].pass !== p) { msgBanner = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'; renderMain(); return; }
        state.currentUser = u;
        save(); goRoute('home');
      }
    }
    function doLogout() {
      state.currentUser = null;

    }
    function doRedeemCode() {
      if (!state.currentUser) { goRoute('login'); return; }
      const code = (document.getElementById('inpRedeem')?.value || '').trim().toUpperCase();
      const found = state.redeemCodes.find(c => c.code === code && !c.used);
      if (!found) { msgBanner = 'โค้ดไม่ถูกต้องหรือถูกใช้งานแล้ว'; renderMain(); return; }
      found.used = true;
      state.users[state.currentUser].balance += found.amount;
      state.kpis.totalTopupAmount = (state.kpis.totalTopupAmount || 0) + found.amount;
      state.kpis.topupToday = (state.kpis.topupToday || 0) + found.amount;
      state.topups.unshift({ id: 'TOP-' + Date.now(), user: state.currentUser, method: 'โค้ดเติมเงิน', amount: found.amount, at: new Date().toLocaleString('th-TH') });
      msgBanner = 'เติมเงินสำเร็จ +' + found.amount + ' ฿ เข้ากระเป๋าแล้ว!';
      save();
    }
    function doBuy() {
      if (!state.currentUser) { goRoute('login'); return; }
      const p = state.products.find(x => x.id === selectedProductId);
      if (!p || p.stockCount < pdpQty) { msgBanner = 'สต๊อกสินค้าไม่เพียงพอ'; renderMain(); return; }
      const total = p.price * pdpQty;
      if (state.users[state.currentUser].balance < total) { msgBanner = 'ยอดเงินไม่เพียงพอ กรุณาเติมเงิน'; renderMain(); return; }
      state.users[state.currentUser].balance -= total;
      p.stockCount -= pdpQty;
      state.kpis.totalSoldCount = (state.kpis.totalSoldCount || 0) + pdpQty;
      state.kpis.soldToday = (state.kpis.soldToday || 0) + pdpQty;
      const delivered = 'ORDER #' + Date.now() + ' | ' + p.title + ' x' + pdpQty + ' | ติดต่อรับ/แจ้งปัญหา LINE ' + state.settings.lineId;
      state.orders.unshift({ id: 'ORD-' + Date.now(), user: state.currentUser, title: p.title, qty: pdpQty, total, item: delivered, at: new Date().toLocaleString('th-TH') });
      save();
      document.getElementById('rcpTitle').textContent = p.title + ' (' + total + ' ฿)';
      document.getElementById('rcpItem').textContent = delivered;
      document.getElementById('receiptModal').classList.remove('hidden');
    }

      if (!live || !Array.isArray(live.products)) return;
      const fallbackMap = {};
      STORE_DATA.products.forEach(p => { fallbackMap[p.id] = p.imageUrl; });
      state.products = live.products.map(p => ({
        ...p,
        imageUrl: (p.imageUrl && p.imageUrl.startsWith('data:'))
          ? p.imageUrl
          : (fallbackMap[p.id] || (STORE_DATA.originUrl ? STORE_DATA.originUrl + p.imageUrl : p.imageUrl))
      }));
      if (live.kpis) state.kpis = live.kpis;
      if (live.activities) state.activities = live.activities;
      if (live.reviews) state.reviews = live.reviews;
      if (live.settings) {

          ...state.settings,

          heroImage: STORE_DATA.settings.heroImage,

                </div>
                <div class="search-wrap">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                  <input class="search-input" value="${esc(searchQuery)}" oninput="searchQuery=this.value;renderMain();" placeholder="ค้นหารหัสเกม / อุปกรณ์..." />
                </div>
              </div>
              <div class="cat-pills">
                ${cats.map(c => `<button type="button" class="cat-pill ${selectedCategory === c ? 'active' : ''}" onclick="selectedCategory='${esc(c)}';renderMain();">${esc(c)}</button>`).join('')}
              </div>
              <div class="prod-grid">
                ${filtered.map(p => `
                  <article class="prod-card">
                    <button type="button" onclick="goRoute('product-detail', '${esc(p.id)}')" style="display:block;width:100%;">
                      <img class="prod-img" src="${esc(p.imageUrl)}" alt="${esc(p.title)}" />
                    </button>
                    <div class="prod-body">
                      <div>
                        <div style="font-size:12px;color:#a1a1aa;">${esc(p.category)}</div>
                        <h3 class="prod-title">${esc(p.title)}</h3>
                      </div>
                      <div>
                        <div class="prod-price mono">${Number(p.price).toLocaleString()} ฿</div>
                        <div class="prod-actions">
                          <button type="button" class="prod-buy" onclick="goRoute('product-detail', '${esc(p.id)}')">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
                            ${p.stockCount > 0 ? 'สั่งซื้อ' : 'ดูรายละเอียด'}
                          </button>
                          <div class="prod-stock mono">${p.stockCount > 0 ? 'คงเหลือ ' + p.stockCount : '<span style="color:#f87171;">สินค้าหมด</span>'}</div>
                        </div>
                      </div>
                    </div>
                  </article>
                `).join('')}
              </div>
            </section>
          </div>
        `;
        return;
      }

      if (activeRoute === 'product-detail') {
        const p = state.products.find(x => x.id === selectedProductId) || state.products[0];
        if (!p) { goRoute('home'); return; }
        const bal = u && state.users[u] ? state.users[u].balance : 0;
        main.innerHTML = `
          <div class="sub-wrap">
            <button type="button" onclick="goRoute('home')" style="font-size:12px;color:#a1a1aa;margin-bottom:16px;">← กลับหน้าร้าน</button>
            <div class="sub-card two-col">
              <div><img src="${esc(p.imageUrl)}" alt="${esc(p.title)}" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;" /></div>
              <div style="display:flex;flex-direction:column;justify-content:space-between;gap:14px;">
                <div>
                  <div style="font-size:12px;color:var(--accent);font-weight:700;">${esc(p.category)}</div>
                  <h1 class="display" style="font-size:24px;font-weight:800;margin-top:4px;">${esc(p.title)}</h1>
                  <p style="margin-top:8px;font-size:13px;color:#a1a1aa;line-height:1.6;">${esc(p.description || '')}</p>
                  <div style="margin-top:16px;padding:14px;border-radius:12px;border:1px solid #27272a;background:#07070a;display:flex;justify-content:space-between;align-items:center;">
                    <div><div style="font-size:11px;color:#a1a1aa;">ราคาต่อชิ้น</div><div class="mono" style="font-size:26px;font-weight:800;color:var(--accent);">${Number(p.price).toLocaleString()} ฿</div></div>
                    <div style="text-align:right;"><div style="font-size:11px;color:#a1a1aa;">คงเหลือ</div><div class="mono" style="font-size:18px;font-weight:800;color:#34d399;">${p.stockCount} ชิ้น</div></div>
                  </div>
                  <div style="margin-top:14px;display:flex;align-items:center;justify-content:space-between;">
                    <span style="font-size:13px;font-weight:700;">จำนวน</span>
                    <div style="display:flex;align-items:center;gap:10px;">
                      <button type="button" class="btn-dark" style="padding:6px 12px;" onclick="pdpQty=Math.max(1,pdpQty-1);renderMain();">-</button>
                      <strong class="mono">${pdpQty}</strong>
                      <button type="button" class="btn-dark" style="padding:6px 12px;" onclick="pdpQty=Math.min(${Math.max(1, p.stockCount)},pdpQty+1);renderMain();">+</button>
                    </div>
                  </div>
                  <div style="margin-top:10px;font-size:12px;color:#a1a1aa;">ยอดเงินของคุณ: <strong class="mono" style="color:#fff;">${bal.toFixed(2)} ฿</strong></div>
                  ${msgBanner ? '<div style="margin-top:10px;padding:10px;border-radius:10px;background:rgba(127,29,29,0.4);color:#fca5a5;font-size:12px;">' + esc(msgBanner) + '</div>' : ''}
                </div>
                <button type="button" class="btn-primary" style="width:100%;padding:14px;" onclick="doBuy()">${p.stockCount > 0 ? (u ? 'สั่งซื้อเลย (' + (p.price * pdpQty).toLocaleString() + ' ฿)' : 'เข้าสู่ระบบเพื่อสั่งซื้อ') : 'สินค้าหมดชั่วคราว'}</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (activeRoute === 'login' || activeRoute === 'register') {
        const isReg = activeRoute === 'register';
        main.innerHTML = `
          <div class="sub-wrap" style="max-width:440px;">
            <div class="sub-card">
              <button type="button" onclick="goRoute('home')" style="font-size:12px;color:#a1a1aa;">← กลับหน้าแรก</button>
              <h1 class="display" style="font-size:24px;font-weight:800;margin-top:14px;">${isReg ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ'}</h1>
              <p style="font-size:12px;color:#a1a1aa;margin-top:4px;">${isReg ? 'สร้างบัญชีใหม่เพื่อเติมเงินและสั่งซื้อสินค้า' : 'ยินดีต้อนรับกลับมา เข้าสู่ระบบเพื่อใช้งาน'}</p>
              <input id="inpUser" class="field-input" style="margin-top:16px;" placeholder="ชื่อผู้ใช้" />
              <input id="inpPass" type="password" class="field-input" style="margin-top:10px;" placeholder="รหัสผ่าน (อย่างน้อย 4 ตัว)" />
              ${msgBanner ? '<div style="margin-top:12px;padding:10px;border-radius:10px;background:rgba(127,29,29,0.4);color:#fca5a5;font-size:12px;">' + esc(msgBanner) + '</div>' : ''}
              <button type="button" class="btn-primary" style="width:100%;margin-top:16px;padding:12px;" onclick="doAuth('${isReg ? 'register' : 'login'}')">${isReg ? 'สมัครสมาชิกเลย' : 'เข้าสู่ระบบ'}</button>
              <button type="button" onclick="goRoute('${isReg ? 'login' : 'register'}')" style="width:100%;margin-top:10px;font-size:12px;color:#a1a1aa;">${isReg ? 'มีบัญชีแล้ว? เข้าสู่ระบบ' : 'ยังไม่มีบัญชี? สมัครสมาชิกใหม่'}</button>
            </div>
          </div>
        `;
        return;
      }

      if (activeRoute === 'topup' || activeRoute === 'topup-code' || activeRoute === 'topup-qr' || activeRoute === 'topup-angpao') {
        main.innerHTML = `
          <div class="sub-wrap" style="max-width:760px;">
            <button type="button" onclick="goRoute('home')" style="font-size:12px;color:#a1a1aa;margin-bottom:14px;">← กลับหน้าร้าน</button>
            <div class="sub-card">
              <h1 class="display" style="font-size:22px;font-weight:800;">เติมเงินเข้ากระเป๋า</h1>
              <p style="font-size:12px;color:#a1a1aa;margin-top:4px;">เลือกช่องทางเติมเงิน: โค้ดเติมเงิน, สแกน QR TrueMoney / ธนาคาร หรือซองอั่งเปา</p>
              <div style="margin-top:16px;padding:16px;border-radius:14px;border:1px solid #27272a;background:#07070a;">
                <h2 style="font-size:15px;font-weight:700;">🔑 เติมเงินด้วยโค้ด (Redeem Code)</h2>
                <input id="inpRedeem" class="field-input mono" placeholder="กรอกโค้ดเช่น ART10-XXXX-XXXX" />
                ${msgBanner ? '<div style="margin-top:10px;font-size:12px;color:#34d399;font-weight:700;">' + esc(msgBanner) + '</div>' : ''}
                <button type="button" class="btn-primary" style="width:100%;margin-top:12px;padding:12px;" onclick="doRedeemCode()">ยืนยันเติมเงินด้วยโค้ด</button>
              </div>
              <div class="two-col" style="margin-top:16px;">
                <div style="padding:16px;border-radius:14px;border:1px solid #27272a;background:#07070a;text-align:center;">
                  <h3 style="font-size:14px;font-weight:700;">สแกน QR TrueMoney &amp; ธนาคาร</h3>
                  <img src="${esc(s.promptPayQrImage)}" alt="PromptPay QR" style="width:200px;max-width:100%;border-radius:12px;margin:12px auto;display:block;" />
                  <p style="font-size:12px;color:#a1a1aa;">สแกนโอนแล้วแจ้งแอดมินทาง LINE: ${esc(s.lineId)}</p>
                </div>
                <div style="padding:16px;border-radius:14px;border:1px solid #27272a;background:#07070a;text-align:center;">
                  <h3 style="font-size:14px;font-weight:700;">TrueMoney ซองอั่งเปา</h3>
                  <p style="font-size:12px;color:#a1a1aa;margin-top:10px;">เบอร์รับซอง (ปกปิดเพื่อความปลอดภัย)</p>
                  <p class="mono" style="font-size:16px;font-weight:800;color:#fff;margin:8px 0;">${esc(s.trueMoneyPhoneMasked)}</p>
                  <button type="button" class="btn-primary" style="width:100%;margin-top:12px;" onclick="window.open('${esc(STORE_DATA.originUrl || '#')}', '_blank')">เปิดหน้าเว็บหลักเพื่อเติมซองอัตโนมัติ</button>
                </div>
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (activeRoute === 'contact') {
        main.innerHTML = `
          <div class="sub-wrap">
            <button type="button" onclick="goRoute('home')" style="font-size:12px;color:#a1a1aa;margin-bottom:14px;">← กลับหน้าร้าน</button>
            <div class="two-col">
              <div class="sub-card" style="text-align:center;">
                <h2 class="display" style="font-size:18px;font-weight:800;">สแกน LINE ติดต่อแอดมิน</h2>
                <img src="${esc(s.lineQrImage)}" alt="LINE QR Code" style="width:220px;max-width:100%;border-radius:12px;margin:14px auto;display:block;background:#fff;padding:8px;" />
                <div style="font-size:12px;color:#a1a1aa;">ID LINE</div>
                <div class="mono" style="font-size:20px;font-weight:800;color:#34d399;margin-top:4px;">${esc(s.lineId)}</div>
              </div>
              <div class="sub-card" style="display:flex;flex-direction:column;justify-content:center;text-align:center;">
                <h2 class="display" style="font-size:18px;font-weight:800;">Facebook แอดมิน</h2>
                <div style="margin-top:16px;padding:24px;border-radius:14px;border:1px solid #27272a;background:#07070a;">
                  <div style="font-size:12px;color:#a1a1aa;">ชื่อเฟซบุ๊ก</div>
                  <div class="display" style="font-size:26px;font-weight:800;color:#fff;margin-top:6px;">${esc(s.facebookName)}</div>
                  <p style="font-size:12px;color:#a1a1aa;margin-top:8px;">ค้นหาชื่อเฟซบุ๊กนี้เพื่อติดต่อแอดมินโดยตรง</p>
                </div>
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (activeRoute === 'reviews') {
        main.innerHTML = `
          <div class="sub-wrap">
            <button type="button" onclick="goRoute('home')" style="font-size:12px;color:#a1a1aa;margin-bottom:14px;">← กลับหน้าร้าน</button>
            <div class="sub-card">
              <h1 class="display" style="font-size:20px;font-weight:800;">รีวิวจากลูกค้า</h1>
              <div style="margin-top:14px;display:flex;flex-direction:column;gap:10px;">
                ${(state.reviews || []).length === 0 ? '<p style="font-size:13px;color:#a1a1aa;">ยังไม่มีรีวิวในขณะนี้</p>' : state.reviews.map(r => '<div style="padding:12px;border-radius:12px;border:1px solid #27272a;background:#07070a;"><strong>' + esc(r.username) + ' · ' + r.rating + '⭐</strong><p style="font-size:13px;color:#d4d4d8;margin-top:4px;">' + esc(r.comment) + '</p></div>').join('')}
              </div>
            </div>
          </div>
        `;
        return;
      }

      // Profile / Orders
      const myOrders = state.orders.filter(o => o.user === u);
      main.innerHTML = `
        <div class="sub-wrap">
          <button type="button" onclick="goRoute('home')" style="font-size:12px;color:#a1a1aa;margin-bottom:14px;">← กลับหน้าร้าน</button>
          <div class="sub-card">
            <h1 class="display" style="font-size:20px;font-weight:800;">${activeRoute === 'profile' ? 'โปรไฟล์ของฉัน' : 'ประวัติการสั่งซื้อ'}</h1>
            ${u ? '<p style="margin-top:6px;font-size:13px;color:#a1a1aa;">ผู้ใช้: <strong style="color:#fff;">' + esc(u) + '</strong> · ยอดเงิน: <strong class="mono" style="color:#34d399;">' + (state.users[u]?.balance || 0).toFixed(2) + ' ฿</strong></p>' : '<p style="margin-top:8px;font-size:13px;color:#f87171;">กรุณาเข้าสู่ระบบก่อนดูข้อมูลบัญชี</p>'}
            <div style="margin-top:16px;display:flex;flex-direction:column;gap:10px;">
              ${myOrders.length === 0 ? '<p style="font-size:13px;color:#a1a1aa;">ยังไม่มีประวัติการสั่งซื้อ</p>' : myOrders.map(o => '<div style="padding:12px;border-radius:12px;border:1px solid #27272a;background:#07070a;"><div style="font-weight:700;">' + esc(o.title) + ' × ' + o.qty + ' (' + o.total + ' ฿)</div><div class="mono" style="font-size:11px;color:#34d399;margin-top:4px;">' + esc(o.item) + '</div></div>').join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderAll() {
      renderChrome();
      renderMain();
    }
    renderAll();

    // Auto-sync live restocks & settings from store backend whenever reachable
    if (STORE_DATA.originUrl) {
      fetch(STORE_DATA.originUrl + '/api/store', { mode: 'cors' })
        .then(r => r.ok ? r.json() : null)
        .then(live => {
          if (!live) return;
          applyLiveStore(live);
          try {
            const es = new EventSource(STORE_DATA.originUrl + '/api/events');
            es.onmessage = (e) => { try { applyLiveStore(JSON.parse(e.data)); } catch {} };
          } catch {}
        })
        .catch(() => {});
    }
  </script>
</body>
</html>
